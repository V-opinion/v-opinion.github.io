name: Auto-generate Sitemap

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Replace this step with your existing sitemap generation command/script
      - name: Generate sitemap.xml
        run: |
          # Your existing sitemap generator command goes here
          echo "Generating sitemap.xml..."

      - name: Create Pull Request with updated sitemap.xml
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-generate sitemap.xml [skip ci]"
          title: "chore: auto-generate sitemap.xml"
          body: "Automated update to `sitemap.xml`."
          branch: chore/auto-sitemap
          delete-branch: true
