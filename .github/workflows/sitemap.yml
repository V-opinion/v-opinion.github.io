name: Generate Sitemap automatically

on:
  push:
    branches:
      - main
    paths:
      - '**.md' # Only runs when Markdown files are added or updated

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Sitemap Generator
        run: python generate_sitemap.py

      - name: Commit and Push Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Update sitemap.xml" && git push)
