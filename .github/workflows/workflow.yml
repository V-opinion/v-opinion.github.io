name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Run your sitemap generator script automatically on every build!
      - name: Generate Sitemap
        run: node name-of-your-script.js  # Replace with your script's actual filename (e.g., sitemap.js)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # Uploads your root folder, including the newly generated sitemap.xml

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
