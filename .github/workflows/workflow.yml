name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Replace this step with whatever script/tool generates your sitemap
      # Make sure your sitemap generator's base URL is set to:
      # https://www.multireligionvalsystem.eu.org
      - name: Generate Sitemap
        run: |
          echo "Run your sitemap generator here and output to ./sitemap.xml"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Uploads the root folder (including your freshly generated sitemap.xml)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
