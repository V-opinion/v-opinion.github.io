<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles | Multi-Religion Election System</title>
  <meta name="description" content="Explore articles and analysis on the Multi-Religion Election System, democracy, and religious freedom.">
  <link rel="canonical" href="https://www.multireligionvalsystem.eu.org/articles/">

  <style>
    :root {
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --accent: #1d4ed8;
      --border: #e5e7eb;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: var(--text-main);
      max-width: 740px;
      margin: 0 auto;
      padding: 2rem 1.25rem;
    }
    nav {
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    nav a {
      color: var(--accent);
      text-decoration: none;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }
    .article-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .article-card {
      padding: 1.5rem 0;
      border-top: 1px solid var(--border);
    }
    .article-card:last-child {
      border-bottom: 1px solid var(--border);
    }
    .article-card time {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .article-card h2 {
      font-size: 1.3rem;
      margin: 0.25rem 0 0.5rem 0;
    }
    .article-card h2 a {
      color: var(--accent);
      text-decoration: none;
    }
    .article-card h2 a:hover {
      text-decoration: underline;
    }
    .article-card p {
      margin: 0;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <nav aria-label="Breadcrumb">
    <a href="/">&larr; Back to Home</a>
  </nav>

  <main>
    <header>
      <h1>Articles</h1>
      <p class="subtitle">Publications, analysis, and essays on the Multi-Religion Election System.</p>
    </header>

    <ul class="article-list">
      <!-- Copy and paste this <li> block for each new article -->
      <li class="article-card">
        <time datetime="2026-11-17">November 17, 2026</time>
        <h2><a href="/articles/[your-article-slug]/">[Article Title]</a></h2>
        <p>[Short 1–2 sentence summary of what the reader will learn in this article.]</p>
      </li>
    </ul>
  </main>

</body>
</html>
